name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The test suite reads the repository and nothing else. Granting only read
# access means a malicious pull request cannot use this workflow's token to
# modify the repo, even if it manages to run code during the build.
permissions:
  contents: read

# A new push to a pull request makes the in-flight run obsolete, so cancel it.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing combination, not just the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # One macOS entry to catch platform-specific path handling. The suite
          # exercises filenames containing quotes and spaces, which behave
          # differently across filesystems.
          - os: macos-latest
            python-version: "3.12"
        # windows-latest is intentionally absent. run_command resolves the
        # executable with shutil.which specifically to support Windows, so
        # Windows coverage would be valuable, but the regression tests create
        # files named with characters NTFS forbids (* " \ | and trailing
        # spaces). Adding Windows requires making those cases skip per
        # platform first; tracked as follow-up work rather than papered over
        # with a green check that skips the security-relevant tests.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the package rather than relying on PYTHONPATH, so the tests run
      # against the same layout users get from pip, including package_data such
      # as rules_metadata.json and the .guard rule files.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      # cfn-guard is deliberately NOT installed. The CLI tests stub the
      # subprocess boundary and assert on the argument list handed to
      # cfn-guard, which is where the crafted-filename scan bypass lived.
      # Keeping the binary out also proves the suite has no hidden dependency
      # on it.
      - name: Verify the console script is installed
        run: susscanner --version

      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose
